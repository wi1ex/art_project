# Install as /etc/ssh/sshd_config.d/00-art-project-key-only.conf only AFTER
# a separate public-key-only login succeeds. Validate effective settings before
# reloading ssh; an earlier setting or a Match block can override this file.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
