server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Resolve again after the API container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $api_upstream api:8000;
    location = /api/healthz {
        access_log off;
        limit_except GET { deny all; }
        proxy_pass http://$api_upstream/healthz;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_next_upstream off;
    }
    location = /api/leads {
        access_log off;
        error_log /dev/null;
        client_max_body_size 2k;
        client_body_timeout 10s;
        limit_except POST { deny all; }
        proxy_pass http://$api_upstream/leads;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
        # A POST must never be repeated by the proxy after an upstream failure.
        proxy_next_upstream off;
    }
    location /api/ { return 404; }
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location / { try_files $uri $uri/ =404; }
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
