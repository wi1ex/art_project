services:
  web:
    image: ${APP_IMAGE:?APP_IMAGE must reference a release image}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  api:
    image: ${API_IMAGE:?API_IMAGE must reference a release image}
    env_file:
      - ${API_ENV_FILE:-/opt/art-project/config/api.env}
    environment:
      DATABASE_PATH: /data/leads.sqlite3
      GEOIP_DATABASE_PATH: /geoip/country.mmdb
    volumes:
      - leads-data:/data
      - ${GEOIP_DIRECTORY:-/opt/art-project/config/geoip}:/geoip:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 192m
    cpus: 1.0
    pids_limit: 50
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2); assert json.load(response)['status'] == 'ok'"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  leads-data:
