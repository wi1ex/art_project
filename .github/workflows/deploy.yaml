name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend/tests -v
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - run: bash tests/deploy-release.sh
      - run: python -m unittest discover -s tests -p 'test_runtime_config.py' -v
      - name: Build and smoke-test release images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker build -t "art-project:$GITHUB_SHA" .
          docker build -f backend/Dockerfile -t "art-project-api:$GITHUB_SHA" backend
          export APP_IMAGE="art-project:$GITHUB_SHA"
          export API_IMAGE="art-project-api:$GITHUB_SHA"
          export API_ENV_FILE="$RUNNER_TEMP/art-project-smoke.env"
          printf 'LEADS_ENABLED=false\nLEADS_ALLOWED_ORIGINS=http://127.0.0.1\n' > "$API_ENV_FILE"
          trap 'docker compose -p smoke -f deploy/compose.production.yaml down --volumes --remove-orphans; rm -f "$API_ENV_FILE"' EXIT
          docker compose -p smoke -f deploy/compose.production.yaml up -d --wait --wait-timeout 90
          for language in ru en cs; do
            curl --fail --silent --show-error "http://127.0.0.1/$language/" > /dev/null
          done
          curl --fail --silent --show-error http://127.0.0.1/api/healthz |
            python -c 'import json, sys; result = json.load(sys.stdin); assert result["status"] == "ok" and result["accepting_leads"] is False'
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/leads-response.json" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1' \
            --data '{"phone":"+420774411158","consent":true,"request_id":"1b2fb96e-3456-4531-8ccc-6226df6ed560","website":""}' \
            http://127.0.0.1/api/leads)
          [[ "$status" == 503 ]]
          docker compose -p smoke -f deploy/compose.production.yaml down --volumes --remove-orphans
          rm -f "$API_ENV_FILE"
          trap - EXIT
          mkdir -p release
          docker save "art-project:$GITHUB_SHA" "art-project-api:$GITHUB_SHA" | gzip -1 > release/image.tar.gz
          cp deploy/compose.production.yaml deploy/release.sh release/
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: release-${{ github.sha }}
          path: release/
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Deploy over verified SSH
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_PASSWORD: ${{ secrets.TELEGRAM_ADMIN_PASSWORD }}
          LEADS_ENABLED: ${{ vars.LEADS_ENABLED }}
          LEADS_ALLOWED_ORIGINS: ${{ vars.LEADS_ALLOWED_ORIGINS }}
          TELEGRAM_RETRY_SECONDS: ${{ vars.TELEGRAM_RETRY_SECONDS }}
        run: |
          set -euo pipefail
          set +x
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'Skipping an outdated commit; a newer main commit exists.'
            exit 0
          fi
          : "${DEPLOY_HOST:?Set DEPLOY_HOST in production secrets}"
          : "${DEPLOY_USER:?Set DEPLOY_USER in production secrets}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY in production secrets}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS in production secrets}"
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 ))
          runtime_config="$RUNNER_TEMP/art-project-api-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.env"
          trap 'rm -f "$HOME/.ssh/deploy_key" "$runtime_config"' EXIT
          python3 deploy/runtime_config.py "$runtime_config"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote="/opt/art-project/incoming/$GITHUB_SHA"
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$target" "mkdir -p '$remote'"
          scp "${ssh_options[@]}" -P "$DEPLOY_PORT" release/* "$target:$remote/"
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$target" \
            "bash '$remote/release.sh' '$GITHUB_SHA' --runtime-config-stdin" < "$runtime_config"
